<svg width="600" height="185" xmlns="http://www.w3.org/2000/svg">
  <style>
    .quote { font: italic 17px Georgia, 'Times New Roman', serif; fill: #58a6ff; }
    .translation { font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #8b949e; }
  </style>
  <rect width="100%" height="185" fill="#141321" rx="12" ry="12"/>
  <text class="quote">
    <tspan x="60.0" y="45">«Be as simple as you can be; you will be astonished to see</tspan>
    <tspan x="60.0" y="69">how uncomplicated and happy your life can become.» —</tspan>
    <tspan x="60.0" y="93">Paramahansa Yogananda</tspan>
  </text>
  <text class="translation">
    <tspan x="60.0" y="125">«Будьте настолько простыми, насколько можете; вы будете удивлены,</tspan>
    <tspan x="60.0" y="140">увидев, насколько несложной и счастливой может стать ваша жизнь.» —</tspan>
    <tspan x="60.0" y="155">Парамаханса Йогананда</tspan>
  </text>
</svg>