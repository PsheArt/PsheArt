<svg width="600" height="132" xmlns="http://www.w3.org/2000/svg">
  <style>
    .quote { font: italic 17px Georgia, 'Times New Roman', serif; fill: #58a6ff; }
    .translation { font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #8b949e; }
  </style>
  <rect width="100%" height="132" fill="#141321" rx="12" ry="12"/>
  <text class="quote">
    <tspan x="60.0" y="45">«Resentment or grudges do no harm to the person against whom</tspan>
    <tspan x="60.0" y="69">you hold these feelings but every day and every night of</tspan>
    <tspan x="60.0" y="93">your life, they are eating at you.» — Norman Vincent Peale</tspan>
  </text>
</svg>