<svg width="600" height="185" xmlns="http://www.w3.org/2000/svg">
  <style>
    .quote { font: italic 17px Georgia, 'Times New Roman', serif; fill: #58a6ff; }
    .translation { font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #8b949e; }
  </style>
  <rect width="100%" height="185" fill="#141321" rx="12" ry="12"/>
  <text class="quote">
    <tspan x="60.0" y="45">«The moment you stop to think about whether you love</tspan>
    <tspan x="60.0" y="69">someone, you've already stopped loving that person forever.»</tspan>
    <tspan x="60.0" y="93">— Carlos Ruiz Zafon</tspan>
  </text>
  <text class="translation">
    <tspan x="60.0" y="125">«В тот момент, когда вы перестанете думать о том, любите ли вы</tspan>
    <tspan x="60.0" y="140">кого-то, вы уже разлюбите этого человека навсегда.» — Карлос Руис</tspan>
    <tspan x="60.0" y="155">Сафон</tspan>
  </text>
</svg>